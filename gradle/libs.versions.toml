# Version catalog: nguồn duy nhất cho phiên bản phụ thuộc/plugin (cập nhật 10/2026).
[versions]
agp = "9.4.0"                 # AGP 9.x: Kotlin tích hợp sẵn (built-in Kotlin), cần Gradle >= 9.6
kotlin = "2.4.21"             # dùng cho Compose compiler plugin; KGP được AGP kéo theo
composeBom = "2026.09.00"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
coroutines = "1.11.0"
junit = "4.13.2"
mlkitTextRecognition = "16.0.1"  # bản gói sẵn mô hình Latin (ổn định, cập nhật gần nhất 08/2024)
mlkitImageLabeling = "17.0.9"     # bản gói sẵn mô hình 400 nhãn
orgJson = "20260814"          # org.json thật cho unit test (android.jar chỉ có stub)

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkitTextRecognition" }
mlkit-image-labeling = { module = "com.google.mlkit:image-labeling", version.ref = "mlkitImageLabeling" }
org-json = { module = "org.json:json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
