name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Nguyên tắc đặc quyền tối thiểu cho GITHUB_TOKEN (workflow này chỉ cần đọc mã nguồn).
permissions:
  contents: read

# Hủy lượt chạy cũ khi có commit mới trên cùng nhánh/PR để tiết kiệm phút chạy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cài JDK 21 (AGP 9 yêu cầu tối thiểu JDK 17)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Cài Android SDK (tự chấp nhận license)
        uses: android-actions/setup-android@v4

      # Dùng Gradle wrapper đã ghim phiên bản + checksum (gradle/wrapper/gradle-wrapper.properties).
      - name: Cài Gradle (cache + dọn dẹp)
        uses: gradle/actions/setup-gradle@v6

      - name: Cấp quyền chạy cho gradlew
        run: chmod +x ./gradlew

      - name: Unit test, lint và build APK debug
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Tải APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Tải báo cáo test và lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
